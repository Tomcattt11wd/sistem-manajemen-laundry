{% extends 'base.html' %}
{% block title %}Error {{ kode }}{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 5rem; margin-bottom: 16px;">
        {% if kode == 404 %}🔍{% else %}⚠️{% endif %}
    </div>
    <h1 style="font-size: 3rem; color: #1a3c5e; font-weight: 800; margin-bottom: 8px;">
        {{ kode }}
    </h1>
    <h2 style="font-size: 1.3rem; color: #333; font-weight: 600; margin-bottom: 12px;">
        {{ judul }}
    </h2>
    <p style="color: #6c757d; max-width: 400px; margin: 0 auto 28px;">
        {{ pesan }}
    </p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">🏠 Ke Dashboard</a>
        <button onclick="history.back()" class="btn btn-secondary">← Kembali</button>
    </div>
</div>
{% endblock %}
